name: ventas-ferreteria
display_name: Ventas Ferretería Avenida
client: Ferretería Avenida
environment: production
priority: critica

development:
  source_path_windows: 'D:\programacion\web\revendedores'

production:
  server: fasa_189
  server_ip: 192.168.0.189
  project_path: /srv/fasa-data/compose/revendedores-src
  compose_file: /srv/fasa-data/compose/revendedores-coolify.compose.yml
  registry: 127.0.0.1:5000
  frontend_image: 127.0.0.1:5000/fasa-revendedores-frontend:staging
  backend_image: 127.0.0.1:5000/fasa-revendedores-backend:staging-env2
  domain: ventas.ferreteriaavenida.com.ar
  public_url: https://ventas.ferreteriaavenida.com.ar
  health_url: https://ventas.ferreteriaavenida.com.ar/health/
  health_url_not_public: false
  internal_backend_url: http://backend:8000
  internal_health_url: http://backend:8000/health/
  frontend_root: /usr/share/nginx/html
  backend_port: 8000
  backend_bind: backend:8000
  media_path: /srv/fasa-data/data/revendedores/media
  logs_path: /srv/fasa-data/data/revendedores/logs
  ssl_certificate: letsencrypt (traefik, gestionado por Coolify)

application:
  type: django
  backend_module: backend.wsgi:application
  backend_runtime: gunicorn
  virtualenv_path_production: /app/.venv (dentro del contenedor)
  logs_path_production: /app/logs (bind mount a logs_path)
  uses_database: true
  database_check: SELECT 1
  database_host: 192.168.0.150:3306

health:
  public_path: /health/
  internal_path: /health/
  expected_status: 200
  expected_json_status: ok
  requires_auth: false
  notes:
    - >-
      El health check está expuesto en el dominio público: el nginx del
      frontend tiene `location = /health/` (match exacto), así que la request
      va al backend y NO cae en el index.html de la SPA. Antes caía en
      `location /` y devolvía HTML con HTTP 200, lo que hacía que un monitor
      que solo mira el status code diera falso positivo.
    - >-
      La ruta real en Django es `/health/` (backend/backend/urls.py), no
      `/api/health/` (eso da 404).
    - >-
      El chequeo incluye un SELECT 1 contra la base: 200 con "status": "ok"
      significa backend + base OK; 500 con "database": "error" significa que
      el backend está vivo pero la base no responde.
  checks:
    - application
    - database
    - timestamp
    - version_or_commit

deploy:
  source_of_truth: repository
  do_not_modify_production_directly: true
  branch: main
  deploy_mode: manual_first
  rollback_strategy: re-tag de la imagen anterior en el registry local
  requires_tests: true
  requires_migrations: false
  requires_frontend_build: true
  notes:
    - >-
      La API de Coolify 4.4.6 responde 500 para todos los tokens (bug de casts()
      en PersonalAccessToken). Para recrear un contenedor usar el compose
      efectivo que genera Coolify, ver deploy_production.md seccion 0.7.

commands:
  test: pytest
  django_test_alternative: python manage.py test api.tests
  migrate: python manage.py migrate
  collectstatic: python manage.py collectstatic --noinput
  restart: docker compose -p <serviceUuid> up -d --no-deps --force-recreate <service>
  logs: docker logs --since 10m <container>
  local_health_test: curl -i http://backend:8000/health/
  public_health_test: curl -i https://ventas.ferreteriaavenida.com.ar/health/
  static_test: curl -sI https://ventas.ferreteriaavenida.com.ar/static/admin/css/base.css
  normalizar_imagenes: >-
    docker exec <backend-container> revendedores-entrypoint python
    manage.py normalizar_imagenes
  cron_normalizar_imagenes: >-
    */30 * * * * sh
    /srv/fasa-data/compose/revendedores-src/scripts/normalizar-imagenes-cron.sh

notes:
  - >-
    El proxy es coolify-proxy (Traefik v3.6) y enruta por el Host
    `ventas.ferreteriaavenida.com.ar` hacia el contenedor frontend.
  - >-
    Las imagenes de productos se sirven en /media/ -> backend (Django).
    El nginx del frontend debe usar `location ^~ /media/` para que la
    location de assets estaticos no capture los .png. Ver deploy_production.md.
  - >-
    No tocar Nginx salvo que /health/ no llegue correctamente al backend.
  - >-
    /static/ lo sirve el backend con WhiteNoise (no nginx): Django bajo
    gunicorn no sirve estáticos. El entrypoint corre `collectstatic` antes de
    levantar gunicorn. Ver deploy_production.md sección 0.9.
  - >-
    El cron de normalización de imágenes corre en el host fasa_189
    (scripts/normalizar-imagenes-cron.sh). Ver deploy_production.md sección 0.11.
  - >-
    No crear código nuevo únicamente en producción.
  - >-
    Todo cambio debe quedar en Git.
  - >-
    El repo fuente de desarrollo está en D:\programacion\web\revendedores.
