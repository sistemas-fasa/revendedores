services:
  mysql:
    image: mysql:8.0
    container_name: revendedores-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fasca
      MYSQL_DATABASE: revendedores
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: revendedores-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "18089:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_media:/app/media
      - backend_logs:/app/logs

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: revendedores-frontend
    restart: unless-stopped
    ports:
      - "15173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_media:
  backend_logs:
