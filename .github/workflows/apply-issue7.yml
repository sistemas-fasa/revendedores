name: Apply issue 7

on:
  workflow_dispatch:
  push:
    branches:
      - issue-7-crossfork-clean
    paths:
      - scripts/apply_issue7.py
      - .github/workflows/apply-issue7.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-7-crossfork-clean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply changes
        run: python scripts/apply_issue7.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: pantalla revisar y enviar pedido (#7)"
          git push
