name: Apply issue 6 clean patch

on:
  push:
    branches:
      - issue-6-crossfork-clean

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: issue-6-crossfork-clean

      - name: Fetch source branches
        run: |
          git fetch origin issue-5-idempotent-checkout issue-6-email-delivery-state

      - name: Build and apply issue 6 patch
        run: |
          git diff origin/issue-5-idempotent-checkout..origin/issue-6-email-delivery-state -- \
            backend/api/migrations/0030_pedido_email_delivery_state.py \
            backend/api/models.py \
            backend/api/serializers.py \
            backend/api/services/notificaciones_pedido.py \
            backend/api/staff_views.py \
            backend/api/tests/test_pedido_notifications.py \
            backend/api/views.py \
            backend/backend/settings.py > /tmp/issue6.patch
          git apply --3way /tmp/issue6.patch
          rm .github/workflows/apply-issue6-clean.yml

      - name: Commit clean issue 6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: emails de pedido trazables y reintentables (#6)'
          git push origin HEAD:issue-6-crossfork-clean
