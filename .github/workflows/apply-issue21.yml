name: Apply issue 21

on:
  push:
    branches:
      - issue-21-product-cards
    paths:
      - scripts/apply_issue21.py
      - .github/workflows/apply-issue21.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-21-product-cards
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_issue21.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-issue21.yml
          git add frontend
          git commit -m "feat: carga rápida desde tarjetas de producto (#21)"
          git push origin HEAD:issue-21-product-cards
