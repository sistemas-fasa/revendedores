name: Fix issue 22 template

on:
  push:
    branches:
      - issue-22-order-sidebar
    paths:
      - scripts/fix_issue22_template.py
      - .github/workflows/fix-issue22.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-order-sidebar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_issue22_template.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-issue22.yml
          git add frontend
          git commit -m "fix: cerrar layout de catálogo con sidebar (#22)"
          git push origin HEAD:issue-22-order-sidebar
