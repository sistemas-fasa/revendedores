name: Fix issue 23 template

on:
  push:
    branches:
      - issue-23-mobile-order-drawer
    paths:
      - scripts/fix_issue23_layout.py
      - .github/workflows/fix-issue23.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-23-mobile-order-drawer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_issue23_layout.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-issue23.yml
          git add frontend
          git commit -m "fix: cerrar layout del drawer móvil (#23)"
          git push origin HEAD:issue-23-mobile-order-drawer
