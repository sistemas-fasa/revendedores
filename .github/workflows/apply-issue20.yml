name: Apply issue 20

on:
  push:
    branches:
      - issue-20-compact-home
    paths:
      - scripts/apply_issue20.py
      - .github/workflows/apply-issue20.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-20-compact-home
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_issue20.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-issue20.yml scripts/apply_issue20.py
          git add frontend
          git commit -m "feat: compactar home y condiciones comerciales (#20)"
          git push origin HEAD:issue-20-compact-home
